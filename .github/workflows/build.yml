name: Build installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 xclip python3-tk
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onefile --name ArabicLayoutFixer --icon assets/icon.png layoutfix/__main__.py
          mv dist/ArabicLayoutFixer.exe dist/ArabicLayoutFixer-Windows.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconsole --onefile --name ArabicLayoutFixer layoutfix/__main__.py
          mv dist/ArabicLayoutFixer dist/ArabicLayoutFixer-Linux

      - name: Build (macOS .app in a .dmg)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ArabicLayoutFixer --icon assets/icon.png \
            --osx-bundle-identifier com.aelassal.arabiclayoutfixer layoutfix/__main__.py
          APP=dist/ArabicLayoutFixer.app
          # menu-bar-only app: no Dock icon
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" $APP/Contents/Info.plist
          codesign --force --deep --sign - $APP          # ad-hoc signature (required on Apple Silicon)
          mkdir dmgroot && cp -R $APP dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Arabic Layout Fixer" -srcfolder dmgroot -ov -format UDZO dist/ArabicLayoutFixer-macOS.dmg
          rm -rf dist/ArabicLayoutFixer dist/ArabicLayoutFixer.app

      - uses: actions/upload-artifact@v4
        with:
          name: ArabicLayoutFixer-${{ runner.os }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
