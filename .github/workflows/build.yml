name: Build installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux tray deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 xclip
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - run: pyinstaller --noconsole --onefile --name ArabicLayoutFixer layoutfix/__main__.py
      - name: Rename per OS
        shell: bash
        run: |
          cd dist
          for f in *; do
            ext=""; [[ "$f" == *.* ]] && ext=".${f##*.}"
            mv "$f" "ArabicLayoutFixer-${{ runner.os }}${ext}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ArabicLayoutFixer-${{ runner.os }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
