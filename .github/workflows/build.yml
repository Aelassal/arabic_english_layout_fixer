name: Build installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS-AppleSilicon }
          - { os: macos-15-intel, name: macOS-Intel }
          - { os: ubuntu-22.04, name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (the version in the comment), not movable tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python -c "import tkinter"
      - run: python -m unittest discover -s tests

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onefile --name ArabicLayoutFixer --icon assets/icon.png layoutfix/__main__.py
          mv dist/ArabicLayoutFixer.exe dist/ArabicLayoutFixer-Windows.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name ArabicLayoutFixer layoutfix/__main__.py
          mv dist/ArabicLayoutFixer dist/ArabicLayoutFixer-Linux

      - name: Build (macOS .app in a .dmg)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ArabicLayoutFixer --icon assets/icon.png \
            --osx-bundle-identifier com.aelassal.arabiclayoutfixer layoutfix/__main__.py
          APP=dist/ArabicLayoutFixer.app
          # menu-bar-only app: no Dock icon
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" $APP/Contents/Info.plist
          codesign --force --deep --sign - $APP          # ad-hoc signature (required on Apple Silicon)
          mkdir dmgroot && cp -R $APP dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Arabic Layout Fixer" -srcfolder dmgroot -ov -format UDZO "dist/ArabicLayoutFixer-${{ matrix.name }}.dmg"
          rm -rf dist/ArabicLayoutFixer dist/ArabicLayoutFixer.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ArabicLayoutFixer-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only this job can publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
