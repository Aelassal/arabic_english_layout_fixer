name: Size experiment
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip xvfb
      - run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build variants
        run: |
          EXC="--exclude-module ssl --exclude-module _ssl --exclude-module http --exclude-module urllib \
               --exclude-module email --exclude-module xml --exclude-module xmlrpc --exclude-module unittest \
               --exclude-module pydoc --exclude-module doctest --exclude-module sqlite3 --exclude-module _sqlite3 \
               --exclude-module lzma --exclude-module bz2 --exclude-module asyncio --exclude-module concurrent \
               --exclude-module multiprocessing --exclude-module distutils --exclude-module setuptools \
               --exclude-module pkg_resources --exclude-module curses --exclude-module readline \
               --exclude-module PIL._webp --exclude-module PIL._avif --exclude-module PIL._imagingft \
               --exclude-module PIL._imagingcms --exclude-module PIL._imagingtk"
          HID="--hidden-import pynput.keyboard._xorg --hidden-import pynput.mouse._xorg"
          [ "$RUNNER_OS" = Linux ] || HID=""
          pyinstaller --onefile --noconfirm --name base --distpath out/base $HID run.py
          pyinstaller --onefile --noconfirm --name slim --distpath out/slim $HID $EXC run.py
          pyinstaller --onedir  --noconfirm --name dir  --distpath out/dir  $HID $EXC run.py

      - name: Measure
        run: python .github/tmp/measure.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Slim build still works (settings window opens)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./out/slim/slim --selftest
          xvfb-run -a bash -c './out/slim/slim --settings & p=$!; sleep 4; kill -0 $p && echo "settings window stayed up"; kill $p'
